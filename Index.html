<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scanner Barcode</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin:auto; padding:16px; }
    .card {
      background:#111827;
      border:1px solid #334155;
      border-radius:24px;
      padding:18px;
      box-shadow:0 12px 40px rgba(0,0,0,.3);
    }
    h1 { margin:0 0 6px; font-size:24px; }
    p { color:#cbd5e1; }
    #reader {
      width:100%;
      overflow:hidden;
      border-radius:18px;
      background:#000;
      margin-top:16px;
      min-height:280px;
    }
    button {
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      margin-top:12px;
    }
    .primary { background:#4f46e5; color:white; }
    .secondary { background:#334155; color:white; }
    .danger { background:#dc2626; color:white; }
    .manual {
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .manual input {
      flex:1;
      min-width:0;
      border:1px solid #475569;
      background:#0f172a;
      color:white;
      padding:14px;
      border-radius:14px;
      font-size:16px;
    }
    .manual button { width:auto; margin:0; padding:14px 18px; }
    .ok {
      display:none;
      background:#052e16;
      border:1px solid #166534;
      padding:14px;
      border-radius:14px;
      margin-top:12px;
    }
    .error {
      background:#450a0a;
      border:1px solid #991b1b;
      padding:14px;
      border-radius:14px;
      margin-top:12px;
      display:none;
    }
    .small { font-size:13px; color:#94a3b8; line-height:1.5; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Scan Barcode</h1>
    <p id="status">Mempersiapkan kamera...</p>

    <div id="reader"></div>

    <button id="startBtn" class="primary" onclick="startScanner()">📷 Buka Kamera</button>
    <button id="stopBtn" class="danger" onclick="stopScanner()" style="display:none">⏹ Tutup Kamera</button>

    <div id="success" class="ok"></div>
    <div id="error" class="error"></div>

    <div class="manual">
      <input id="manualCode" placeholder="Atau ketik kode barang">
      <button class="secondary" onclick="returnManual()">Kirim</button>
    </div>

    <p class="small">
      Kamera scanner ini berjalan di halaman HTTPS terpisah dari Google Apps Script.
      Ini sengaja dilakukan karena HTML Service Apps Script menggunakan sandbox iframe
      yang membatasi API kamera. citeturn749567search1turn749567search0
    </p>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const returnUrl = params.get('return');
  let scanner = null;
  let isScanning = false;
  let alreadyReturned = false;

  function setStatus(t) {
    document.getElementById('status').textContent = t;
  }

  function showError(t) {
    const el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent = t;
  }

  function hideError() {
    document.getElementById('error').style.display = 'none';
  }

  function showSuccess(t) {
    const el = document.getElementById('success');
    el.style.display = 'block';
    el.textContent = t;
  }

  async function startScanner() {
    hideError();
    if (isScanning) return;

    if (!window.isSecureContext) {
      showError('Halaman scanner harus dibuka melalui HTTPS.');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Browser ini tidak mendukung akses kamera.');
      return;
    }

    try {
      setStatus('Meminta izin kamera...');
      // Memicu permission dari top-level page.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      stream.getTracks().forEach(t => t.stop());

      scanner = scanner || new Html5Qrcode("reader");

      const config = {
        fps: 12,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
          return { width: size, height: size };
        },
        aspectRatio: 1.0
      };

      isScanning = true;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      setStatus('Arahkan kamera ke barcode...');

      await scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        () => {}
      );

    } catch (err) {
      isScanning = false;

      // Fallback: ambil daftar kamera bila facingMode environment gagal.
      try {
        const devices = await Html5Qrcode.getCameras();

        if (!devices || !devices.length) {
          throw new Error('Kamera tidak ditemukan.');
        }

        scanner = scanner || new Html5Qrcode("reader");

        isScanning = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        setStatus('Kamera ditemukan. Arahkan ke barcode...');

        await scanner.start(
          devices[0].id,
          config,
          onScanSuccess,
          () => {}
        );
      } catch (err2) {
        showError(
          'Kamera tidak dapat dibuka. Pastikan izin Kamera di Chrome sudah Izinkan, ' +
          'gunakan HTTPS, dan kamera HP tidak sedang dipakai aplikasi lain.\\n\\n' +
          (err2.message || err2)
        );
        setStatus('Gagal membuka kamera');
      }
    }
  }

  async function stopScanner() {
    if (scanner && isScanning) {
      try { await scanner.stop(); } catch(e) {}
      try { scanner.clear(); } catch(e) {}
    }

    isScanning = false;
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display = 'none';
    setStatus('Kamera ditutup');
  }

  async function onScanSuccess(decodedText) {
    if (alreadyReturned) return;
    alreadyReturned = true;

    await stopScanner();
    showSuccess('Barcode terbaca: ' + decodedText);

    setTimeout(() => {
      if (!returnUrl) {
        setStatus('Barcode terbaca. Kembali ke aplikasi utama.');
        return;
      }

      const u = new URL(returnUrl);
      u.searchParams.set('barcode', decodedText);
      window.location.href = u.toString();
    }, 350);
  }

  function returnManual() {
    const code = document.getElementById('manualCode').value.trim();
    if (!code) return;
    onScanSuccess(code);
  }

  window.onload = () => {
    setStatus('Siap. Tekan Buka Kamera.');
  };
</script>
</body>
</html>
